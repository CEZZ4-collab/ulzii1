
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Give Up</title>
</head>
<h3 style="color: green;">Та гарах үйлдэл хийлээ :3 KHANBANK</h3>
<body>
    <script>
        let uldegdel=0;
        let utga="";
        while(utga != "123"){
            utga = prompt("Та нууц үгээ оруулна уу");
            if(utga == "123"){
                while(true){
                    let uildel = prompt("1.Орлого оруулах. \n2.Зарлага гаргах. \n3.Үлдэгдэл харах.\n4.Гарах." );
                    if(uildel == 1){
                        orlog();
                    }else if(uildel == 2){
                        zarlag();
                    }else if(uildel == 3){
                        alert("Таны үлдэгдэл "+uldegdel+" MNT");
                    }else if(uldel==4){
                        break;
                    }

                function orlog(){
                    orDun = Number( prompt("Та орлог оруулна уу "));
                    if(orDun <= 0){
                        alert("Та буруу утга оруулсан байна");
                        return;
                    }
                        uldegdel += orDun
                }

                function zarlag(){
                    
                    if(uldegdel < 0){
                        alert("Зарлага гарахад үлдэгдэл хүрэлцэхгүй байна");
                        return;
                    }

                    zarDun = Number(prompt("Та зарлагаа оруулна уу"));

                    zarDun = Math.abs(zarDun);

                    if(zarDun <= uldegdel){
                        uldegdel -= zarDun;
                    }
                }
                }
            }

        }
    

    
    </script>
</body>
</html>
